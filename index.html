<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mon Budget">
  <meta name="description" content="Application personnelle de gestion de budget mensuel.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>Mon Budget</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">BUDGET MENSUEL</p>
        <h1>Mon Budget</h1>
      </div>
      <button id="resetBtn" class="icon-button danger" type="button" aria-label="Réinitialiser les données" title="Réinitialiser">↻</button>
    </header>

    <main>
      <section class="month-row" aria-label="Navigation mensuelle">
        <button id="prevMonth" class="icon-button" type="button" aria-label="Mois précédent">‹</button>
        <button id="monthButton" class="month-button" type="button" aria-label="Choisir le mois">
          <span id="monthLabel">Mois</span>
          <span aria-hidden="true">⌄</span>
        </button>
        <button id="nextMonth" class="icon-button" type="button" aria-label="Mois suivant">›</button>
      </section>

      <section class="hero-card" aria-labelledby="availableLabel">
        <div class="hero-topline">
          <div>
            <p id="availableLabel" class="muted">Reste disponible</p>
            <p id="availableAmount" class="hero-amount">0,00 €</p>
          </div>
          <button id="editIncomeBtn" class="ghost-button" type="button">Modifier les revenus</button>
        </div>
        <div class="hero-grid">
          <div><span>Revenus</span><strong id="incomeAmount">0,00 €</strong></div>
          <div><span>Prévu</span><strong id="plannedAmount">0,00 €</strong></div>
          <div><span>Dépensé</span><strong id="spentAmount">0,00 €</strong></div>
        </div>
      </section>

      <section class="section-head">
        <div>
          <p class="eyebrow">RÉPARTITION</p>
          <h2>Enveloppes</h2>
        </div>
        <button id="addEnvelopeBtn" class="primary-button" type="button">＋ Ajouter</button>
      </section>

      <section id="envelopeList" class="envelope-list" aria-live="polite"></section>

      <section class="summary-card">
        <div class="summary-heading">
          <div>
            <p class="eyebrow">SYNTHÈSE</p>
            <h2>Vue d’ensemble</h2>
          </div>
          <span id="summaryStatus" class="status-pill">Équilibré</span>
        </div>
        <dl class="summary-list">
          <div><dt>Revenus</dt><dd id="summaryIncome">0,00 €</dd></div>
          <div><dt>Total prévu</dt><dd id="summaryPlanned">0,00 €</dd></div>
          <div><dt>Total dépensé</dt><dd id="summarySpent">0,00 €</dd></div>
          <div class="summary-total"><dt>Disponible</dt><dd id="summaryAvailable">0,00 €</dd></div>
        </dl>
      </section>
    </main>
  </div>

  <dialog id="editorDialog" class="sheet-dialog">
    <form id="editorForm" method="dialog">
      <div class="dialog-handle" aria-hidden="true"></div>
      <div class="dialog-head">
        <div>
          <p id="dialogEyebrow" class="eyebrow">MODIFICATION</p>
          <h2 id="dialogTitle">Modifier</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="Fermer">×</button>
      </div>
      <div id="editorFields" class="form-fields"></div>
      <div class="dialog-actions">
        <button class="secondary-button" value="cancel" type="button" id="cancelDialogBtn">Annuler</button>
        <button class="primary-button" value="default" type="submit">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <dialog id="monthDialog" class="sheet-dialog compact-dialog">
    <form method="dialog">
      <div class="dialog-handle" aria-hidden="true"></div>
      <div class="dialog-head">
        <h2>Choisir un mois</h2>
        <button class="icon-button" value="cancel" aria-label="Fermer">×</button>
      </div>
      <div id="monthOptions" class="month-options"></div>
    </form>
  </dialog>

  <template id="envelopeTemplate">
    <article class="envelope-card">
      <button class="envelope-summary" type="button" aria-expanded="false">
        <span class="envelope-icon" aria-hidden="true"></span>
        <span class="envelope-copy">
          <strong class="envelope-name"></strong>
          <span class="envelope-description"></span>
        </span>
        <span class="envelope-amount"></span>
        <span class="chevron" aria-hidden="true">⌄</span>
      </button>
      <div class="envelope-body">
        <div class="metric-grid">
          <div><span>Budget</span><strong class="planned-value"></strong></div>
          <div><span>Dépensé</span><strong class="spent-value"></strong></div>
          <div><span>Écart</span><strong class="difference-value"></strong></div>
        </div>
        <div class="progress-row">
          <div class="progress-track"><div class="progress-fill"></div></div>
          <span class="progress-badge"></span>
        </div>
        <p class="envelope-message"></p>
        <div class="expense-header">
          <span class="expense-count"></span>
          <div>
            <button class="text-button edit-envelope" type="button">Modifier</button>
            <button class="text-button add-expense" type="button">＋ Dépense</button>
          </div>
        </div>
        <div class="expense-list"></div>
      </div>
    </article>
  </template>

  <script src="./app.js" defer></script>
</body>
</html>
